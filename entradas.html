<!doctype html>
<html lang="es">
  <head>
    <title>Entradas</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="css/entradas.css" rel="stylesheet" type="text/css" />
    <link href="css/styles_rwd.css" rel="stylesheet" type="text/css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="js/script.js"></script>
    <!-- Favicon -->
    <link rel="icon" href="/img/favicon.png" />
    <!-- Tipografías -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Goldman:wght@400;700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Michroma&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Syne+Tactile&family=Unbounded:wght@200..900&display=swap"
      rel="stylesheet"
    />
    <!-- Iconos -->
    <script
      src="https://kit.fontawesome.com/c3fd22b8e3.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <!-- HERO -->
    <header class="hero">
      <div class="top-row">
        <i class="fa-solid fa-cart-shopping"></i>

        <!-- NAVBAR -->
        <nav class="navbar" id="nav-menu">
          <div class="nav-links">
            <a href="index.html">INICIO</a>
            <a href="entradas.html" class="active">ENTRADAS</a>
            <a href="contacto.html">CONTACTO</a>
          </div>
        </nav>

        <i class="fa-solid fa-user"></i>
      </div>

      <div class="hero-content">
        <p>Van Gogh: Immersive Experience</p>
      </div>
    </header>

    <!-- FORMULARIO ENTRADAS -->

    <section class="entradas-section">
      <div class="contenido-entradas">
        <h1>Selecciona tus entradas</h1>
        <form id="compra-form">
          <label for="nombre">Nombre:</label>
          <input
            type="text"
            id="nombre"
            placeholder="Escribe tu nombre"
            required
          />

          <label for="correo">Correo electrónico:</label>
          <input
            type="email"
            id="correo"
            placeholder="Escribe tu correo"
            required
          />

          <label for="exposicion">Tipo de entrada:</label>
          <select id="exposicion" onchange="costeTotal()">
            <option value="e1">Standard (Galería 360°) - 16,00€</option>
            <option value="e2">
              Premium (Acceso total + VR Experience) - 26,50€
            </option>
            <option value="e3">Nocturne (Experiencia Privada) - 42,00€</option>
          </select>

          <label for="numero">Número de entradas:</label>
          <input
            type="number"
            id="numero"
            min="1"
            max="10"
            placeholder="Número de entradas"
            required
            onchange="costeTotal()"
          />

          <p>Coste total de las entradas: <span id="coste"></span></p>
          <input type="submit" value="Comprar" />
        </form>
      </div>
    </section>
    <div id="modal" style="display: none">
      <div>
        <h2>Compra realizada</h2>
        <p>Nombre: <span id="nom"></span></p>
        <p>Total: <span id="ct"></span></p>
        <button
          onclick="
            document
              .getElementById('modal')
              .style.setProperty('display', 'none', 'important')
          "
        >
          Cerrar
        </button>
      </div>
    </div>
  </body>
</html>
